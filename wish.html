<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bjorn Swertz</title>
<meta name="author" content="Bjorn Swertz">
<meta name="description" content="Send a message to the stars. Made by Bjorn Swertz.">
<style>
:root{--bg:#090908;--card:rgba(18,17,14,.85);--tx:#efe7d6;--mu:#9d9582;--ac:#d8c8a6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:16px;max-width:900px;margin:auto}
h1{font-size:1.4rem;margin:.2em 0}p.s{color:var(--mu);margin:0 0 14px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;background:var(--card);padding:12px;border-radius:12px;margin-bottom:12px}
label{font-size:.75rem;color:var(--mu);display:flex;flex-direction:column;gap:4px}
select,input{background:var(--bg);color:var(--tx);border:1px solid #2e2a22;border-radius:8px;padding:8px;font-size:.95rem}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse}
img{width:56px;height:56px;border-radius:8px;background:#000;display:block}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #201e19;white-space:nowrap}
th{color:var(--mu);font-size:.75rem;font-weight:600}td.n{font-weight:600;color:var(--ac)}
.x{color:var(--mu);font-size:.8rem}#c{color:var(--mu);margin:8px 2px}tr[data-k]{cursor:pointer}#md{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}#md[hidden]{display:none}.cd{background:var(--card);border-radius:14px;padding:16px;max-width:420px;width:100%;max-height:90vh;overflow:auto;position:relative;line-height:1.5}.cd #xx{position:absolute;top:8px;right:8px}img.big{width:100%;height:auto;aspect-ratio:1;border-radius:10px}#mn{background:var(--card);padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:.9rem}button{background:var(--bg);color:var(--tx);border:1px solid #2e2a22;border-radius:8px;padding:8px;font-size:.95rem}button.on{background:var(--ac);color:#000;border-color:var(--ac)}select:disabled{opacity:.4}
body{background:#000;background-attachment:fixed}
.f,#mn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid #2e2a22}
.cd{background:#0d0c0a;border:1px solid #2e2a22}
h1{background:linear-gradient(90deg,#d8c8a6,#f3ecdc);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:1}}
#sk{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#sk i{position:absolute;border-radius:50%;background:#fff}
#sk i.t{animation:tw var(--d) ease-in-out var(--l) infinite}
@media(prefers-reduced-motion:reduce){#sk i.t{animation:none}}
#sk b{position:absolute;width:90px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));opacity:0;animation:ss 1.1s ease-out forwards}
@keyframes ss{0%{opacity:0;transform:translate(0,0) rotate(var(--a))}12%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--a))}}
footer{text-align:center;color:var(--mu);font-size:.85rem;margin:28px 0 12px}
footer a{color:var(--ac);text-decoration:none;border-bottom:1px solid var(--ac)}
nav{display:flex;gap:8px;margin:0 0 8px}nav a{color:var(--mu);text-decoration:none;padding:6px 14px;border:1px solid #2e2a22;border-radius:999px;font-size:.85rem}nav a.on{color:#000;background:var(--ac);border-color:var(--ac)}
.bar{height:3px;border-radius:2px;background:var(--ac);margin-top:4px;opacity:.7}td.w2{white-space:normal;min-width:150px}
.res{background:var(--card);border:1px solid #2e2a22;border-radius:12px;padding:14px;margin:12px 0;line-height:1.5}.bg{font-size:1.5rem;font-weight:700;color:var(--ac);margin:2px 0 8px}input[type=range]{width:100%;padding:0;accent-color:#d8c8a6}.pr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.hid{display:none!important}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}nav a{color:var(--mu);text-decoration:none;padding:6px 14px;border:1px solid #2e2a22;border-radius:999px;font-size:.85rem}nav a.on{color:#000;background:var(--ac);border-color:var(--ac)}
canvas#cv{width:100%;height:340px;display:block;border:1px solid #2e2a22;border-radius:12px;background:rgba(0,0,0,.35);margin-bottom:6px}
footer .nm{display:inline-block;border:1px solid var(--ac);border-radius:8px;padding:4px 12px;color:var(--tx);margin-right:2px}

footer .nm{border:0;padding:0;color:var(--mu);font-size:.8em;opacity:.65}footer a.ig{border-bottom:0;color:var(--mu);font-size:.8em;text-decoration:none;opacity:.65}footer a.ig:hover{opacity:1;text-decoration:underline}
textarea.fly::placeholder{color:transparent}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.wb{max-width:520px;margin:10vh auto 0}
.wb h1{font-size:1.5rem;margin-bottom:6px}
textarea{width:100%;background:var(--card);color:var(--tx);border:1px solid #2e2a22;border-radius:12px;padding:12px;font:inherit;font-size:1rem;resize:none}
.wr{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
#fl{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#fl span{position:absolute;left:0;top:0;will-change:transform,opacity;color:#f3e7c9;text-shadow:0 0 8px rgba(255,236,190,.8);font-weight:600;white-space:pre}
#fl i{position:absolute;border-radius:50%;background:#fff6dc;box-shadow:0 0 8px 2px rgba(255,236,190,.7)}
</style></head><body>
<nav><a href="index.html">Galaxies</a><a href="comets.html">Comets</a><a href="blackholes.html">Black holes</a><a href="fieldofview.html">Field of view</a></nav>
<div class="wb">
<textarea id="wt" maxlength="100" rows="3" placeholder="Write a message…"></textarea>
<div class="wr"><span id="wc" class="x">0 / 100</span><button type="button" id="wg" class="on">Send ✦</button></div>
<p id="wm" class="x" aria-live="polite"></p>
<input type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
</div>
<div id="fl" aria-hidden="true"></div>
<script>
(function(){const sk=document.createElement('div');sk.id='sk';document.body.prepend(sk);
const n=Math.min(260,Math.round(innerWidth*innerHeight/5000));let h='';
for(let i=0;i<n;i++){const z=Math.random(),sz=z<.8?1:z<.95?1.6:2.2,r=Math.random(),tw=r<.32,fast=r<.12;
h+=`<i class="${tw?'t':''}" style="left:${(Math.random()*100).toFixed(2)}%;top:${(Math.random()*100).toFixed(2)}%;width:${sz}px;height:${sz}px;opacity:${(.3+Math.random()*.6).toFixed(2)}${tw?`;--d:${(fast?3.5+Math.random()*3:7+Math.random()*9).toFixed(1)}s;--l:-${(Math.random()*12).toFixed(1)}s`:''}"></i>`}
sk.innerHTML=h;
if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
function shoot(){const b=document.createElement('b'),a=20+Math.random()*25,dx=260+Math.random()*180;
b.style.cssText=`left:${(5+Math.random()*55).toFixed(1)}%;top:${(3+Math.random()*35).toFixed(1)}%;--a:${a.toFixed(0)}deg;--x:${dx.toFixed(0)}px;--y:${(dx*Math.tan(a*Math.PI/180)).toFixed(0)}px`;
sk.appendChild(b);setTimeout(()=>b.remove(),1300);setTimeout(shoot,12000+Math.random()*25000)}
setTimeout(shoot,4000+Math.random()*6000)}})();

const $=id=>document.getElementById(id);
const FORM_KEY='3fe31830-ed29-4460-a03e-29e35ecf28be';   // Web3Forms access key goes here (empty = preview, nothing is sent)
const T=$('wt'),G=$('wg'),M=$('wm');
T.addEventListener('input',()=>{$('wc').textContent=T.value.length+' / 100'});
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function lastSend(){try{return +localStorage.getItem('wish_t')||0}catch(e){return 0}}
function setSend(){try{localStorage.setItem('wish_t',String(Date.now()))}catch(e){}}
async function mail(text){
  const dbg=/[?&]debug/.test(location.search);
  if(!FORM_KEY||$('hp').value){if(dbg)M.textContent='debug: no key or honeypot filled';return}
  try{
    const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({access_key:FORM_KEY,subject:'Message to the stars',from_name:'Message to the stars',name:'Website visitor',message:text})});
    let j={};try{j=await r.json()}catch(e){}
    if(dbg)M.textContent='debug: HTTP '+r.status+' · success='+j.success+' · '+(j.message||'');
  }catch(e){if(dbg)M.textContent='debug: request failed: '+e}
}
function fly(text){
  const box=$('fl'),r=T.getBoundingClientRect(),W=innerWidth,H=innerHeight;
  const cs=getComputedStyle(T),fs=parseFloat(cs.fontSize)||16,fam=cs.fontFamily,lh=parseFloat(cs.lineHeight)||fs*1.25;
  const cv=document.createElement('canvas').getContext('2d');cv.font=fs+'px '+fam;
  const L=[...text],wd=L.map(c=>cv.measureText(c).width);
  const x0=r.left+13+parseFloat(cs.borderLeftWidth||0),maxX=r.right-13;
  let cx=x0,y=r.top+13+lh/2,live=0;T.classList.add('fly');
  L.forEach((ch,i)=>{
    const w=wd[i];
    if(ch!==' '&&(i===0||L[i-1]===' ')){let ww=0,k=i;while(k<L.length&&L[k]!==' '){ww+=wd[k];k++}if(cx+ww>maxX&&cx>x0){cx=x0;y+=lh}}
    else if(cx+w>maxX&&ch!==' '){cx=x0;y+=lh}
    const px=cx,py=y;cx+=w;if(ch.trim()==='')return;
    live++;
    const s=document.createElement('span');s.textContent=ch;s.style.fontSize=fs+'px';s.style.fontFamily=fam;s.style.fontWeight=400;s.style.top='-'+(fs*0.65)+'px';box.appendChild(s);
    const tx=Math.random()*W,ty=H*(0.04+Math.random()*0.4),dly=i*70+Math.random()*300,dur=RM?600:7000+Math.random()*3500,sw=20+Math.random()*30,ph=Math.random()*6;
    const t0=performance.now()+dly;let dot=null;
    (function step(now){
      const p=Math.min(1,Math.max(0,(now-t0)/dur));
      if(now<t0){s.style.transform=`translate(${px}px,${py}px)`;return requestAnimationFrame(step)}
      const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
      const X=px+(tx-px)*e+Math.sin(p*6+ph)*sw*Math.min(1,p*4)*(1-p),Y=py+(ty-py)*e;
      if(p<0.8){s.style.transform=`translate(${X}px,${Y}px) scale(${1-0.7*e}) rotate(${Math.sin(p*5+ph)*18*Math.min(1,p*4)}deg)`;s.style.opacity=1}
      else{
        if(!dot){dot=document.createElement('i');box.appendChild(dot);s.style.opacity=0}
        const q=(p-0.8)/0.2,sz=4+Math.sin(now/180+ph)*1.5;
        dot.style.cssText=`left:${X-sz/2}px;top:${Y-sz/2}px;width:${sz}px;height:${sz}px;opacity:${1-q*q}`;
      }
      if(p<1)requestAnimationFrame(step);else{s.remove();if(dot)dot.remove();if(--live===0)done()}
    })(performance.now());
  });
  if(!live)done();
}

function shoot(nums){
  const box=$('fl'),W=innerWidth,H=innerHeight,cy=H*0.62;
  const WISH=['Good luck ✦','May your dreams come true ✦','Good luck, and dream big ✦'],wt=WISH[Math.floor(Math.random()*WISH.length)];
  const final=()=>{M.innerHTML='<span style="font-size:1.6rem;color:var(--tx);letter-spacing:.15em">✦ '+nums[0]+' · '+nums[1]+' ✦</span><br><span style="font-size:.9rem;font-style:italic">'+wt+'</span>'};
  if(RM){final();return}
  let doneN=0;
  const cap=document.createElement('div');cap.textContent=wt;
  cap.style.cssText='position:absolute;left:0;right:0;top:'+(cy+62)+'px;text-align:center;font-size:1.15rem;font-style:italic;color:#f3e7c9;text-shadow:0 0 10px rgba(255,236,190,.8);opacity:0';
  box.appendChild(cap);
  cap.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'translateY(0)'}],{duration:1400,delay:1100+2400-300,fill:'both'});
  cap.animate([{opacity:1},{opacity:0}],{duration:1200,delay:1100+2400+3500,fill:'forwards'}).onfinish=()=>cap.remove();
  nums.forEach((n,i)=>{
    const cx=W/2+(i?1:-1)*Math.min(70,W*0.18),dx=(i?-1:1)*W*0.55,dy=-H*0.55,ang=Math.atan2(dy,dx)*180/Math.PI,dl=i*1100,dur=2400;
    const el=document.createElement('span');el.textContent=n;
    el.style.cssText='position:absolute;left:'+cx+'px;top:'+cy+'px;font-size:4rem;font-weight:700;color:#fff6dc;text-shadow:0 0 18px rgba(255,236,190,.95),0 0 42px rgba(255,220,150,.6);opacity:0';
    const tr=document.createElement('div');
    tr.style.cssText='position:absolute;left:'+cx+'px;top:'+cy+'px;width:240px;height:3px;border-radius:2px;background:linear-gradient(to right,rgba(255,246,220,.95),rgba(255,246,220,0));transform-origin:0 50%;opacity:0';
    box.appendChild(tr);box.appendChild(el);
    const opt={duration:dur,delay:dl,fill:'both',easing:'cubic-bezier(.15,.65,.3,1)'};
    el.animate([{transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.06)`,opacity:0},{opacity:1,offset:.2},{transform:'translate(-50%,-50%) scale(1)',opacity:1}],opt);
    tr.animate([{transform:`translate(${dx}px,${dy}px) rotate(${ang}deg) scaleX(.3)`,opacity:0},{opacity:.9,offset:.25},{transform:`translate(0,0) rotate(${ang}deg) scaleX(1)`,opacity:0}],opt);
    el.animate([{opacity:1},{opacity:0}],{duration:1200,delay:dl+dur+3500,fill:'forwards'}).onfinish=()=>{el.remove();tr.remove();if(++doneN===nums.length)final()};
  });
}
function done(){T.classList.remove('fly');if(!/^debug/.test(M.textContent))M.textContent='Message sent to the stars ✦';G.disabled=false}
G.onclick=async()=>{
  const v=T.value.trim();if(!v){M.textContent='Write something first.';return}
  const code=v.toLowerCase().replace(/\s+/g,'');
  if(code==='eurojackpot'||code==='eurojackot'){   // easter egg: two random Euro numbers (1-12), never mailed
    const r=()=>{const a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=4294967292);return a[0]%12+1};   // rejection sampling: no modulo bias
    let n1=r(),n2=r();while(n2===n1)n2=r();
    T.value='';$('wc').textContent='0 / 100';M.textContent='';
    shoot([n1,n2]);
    return;
  }
  if(Date.now()-lastSend()<15000){M.textContent='Give the stars a moment, then try again.';return}
  setSend();G.disabled=true;M.textContent='';
  mail(v);fly(v);T.value='';$('wc').textContent='0 / 100';
};
</script>
