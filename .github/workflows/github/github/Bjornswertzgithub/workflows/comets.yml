name: Update comet data
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download comet orbits from NASA JPL
        run: |
          curl -fsS --retry 3 "https://ssd-api.jpl.nasa.gov/sbdb_query.api?sb-kind=c&fields=full_name,e,q,tp,om,w,i,M1,K1&full-prec=1" -o comets.json
          python3 -c "import json;d=json.load(open('comets.json'));assert len(d['data'])>500;print(len(d['data']),'comets')"
      - name: Commit
        run: |
          git config user.name "comet-bot"
          git config user.email "comet-bot@users.noreply.github.com"
          git add comets.json
          git diff --staged --quiet || git commit -m "Update comet data"
          git push
